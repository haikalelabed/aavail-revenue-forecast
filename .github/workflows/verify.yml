name: Verify forecast service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/run_tests.sh
      - run: bash scripts/fetch_data.sh
      - run: docker build -t aavail-forecast .
      - run: docker run --rm aavail-forecast bash scripts/run_tests.sh
      - name: Smoke test the running container
        run: |
          docker run -d --name aavail-forecast -p 127.0.0.1:8000:8000 aavail-forecast
          trap 'docker logs aavail-forecast; docker rm -f aavail-forecast' EXIT
          python scripts/smoke.py
